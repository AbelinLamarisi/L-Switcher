name: Windows build and tests
on:
  release:
    types: [published]
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release x64 and tests
    permissions:
      contents: read
      actions: write
    runs-on: windows-2022
    timeout-minutes: 6
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64 and test executable
        env:
          LSWITCHER_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node tests/ArtifactRetention.Tests.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild LSwitcher.csproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal *>&1 | Tee-Object artifacts/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/BuildVersion.Tests.ps1 *>&1 | Tee-Object artifacts/version-tests.log
          msbuild tests/LSwitcher.Tests.csproj /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal *>&1 | Tee-Object artifacts/test-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run core, UI and DPI tests
        timeout-minutes: 2
        run: |
          ./tests/bin/Release/LSwitcher.Tests.exe --ui-smoke --dpi-smoke *>&1 | Tee-Object artifacts/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload tested executable
        id: executable
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: L-Switcher-win-x64
          path: bin/Release/L-Switcher.exe
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/master' && 90 || 7 }}
      - name: Upload test log and UI previews
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: L-Switcher-test-results
          path: |
            artifacts/*.log
            tests/bin/Release/settings-*.png
            tests/bin/Release/dpi-*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Keep only the newest master executable
        if: success() && github.ref == 'refs/heads/master' && github.event_name != 'release' && steps.executable.outputs.artifact-id != ''
        uses: actions/github-script@v9
        env:
          EXECUTABLE_ARTIFACT_ID: ${{ steps.executable.outputs.artifact-id }}
        with:
          script: |
            const prune = require('./.github/scripts/prune-main-artifacts.js');
            await prune({ github, context, core, artifactId: Number(process.env.EXECUTABLE_ARTIFACT_ID) });
