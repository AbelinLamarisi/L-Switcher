name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release x64 and tests
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and run core, UI and DPI tests
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          ./build.ps1 -Test -UISmoke -DpiSmoke *>&1 | Tee-Object artifacts/build-and-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload tested executable
        uses: actions/upload-artifact@v6
        with:
          name: L-Switcher-win-x64
          path: bin/Release/L-Switcher.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload test log and UI previews
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: L-Switcher-test-results
          path: |
            artifacts/build-and-tests.log
            tests/bin/Release/settings-*.png
            tests/bin/Release/dpi-*.png
          if-no-files-found: warn
          retention-days: 14
